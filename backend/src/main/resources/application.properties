spring.application.name=verifyid-backend

server.port=8080

# ===============================
# Database
# ===============================

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/verifyid_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ===============================
# Application URLs
# ===============================

app.frontend-url=${FRONTEND_URL:http://localhost:5173}
cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# ===============================
# CORS
# ===============================

spring.web.cors.allowed-origins=${CORS_ALLOWED_ORIGIN:http://localhost:5173}
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true